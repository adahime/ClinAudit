[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinaudit"
version = "0.2.0"
description = "Lightweight, zero-heavy-dependency forensic auditing suite for clinical AI splits, evaluation pipelines, Source Data statistics, and deployed risk calculators."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Xingyu Zhang"}
]
keywords = [
    "clinical-ai",
    "forensic-auditing",
    "data-leakage",
    "reproducibility",
    "biostatistics",
    "risk-prediction",
    "decision-curve-analysis",
    "peer-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
clinaudit = "clinaudit.cli:main"

[project.urls]
Author-ORCID = "https://orcid.org/0009-0005-6181-7465"

[tool.setuptools.packages.find]
include = ["clinaudit*"]
