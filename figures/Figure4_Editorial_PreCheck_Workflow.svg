<rect width="1120" height="440" fill="#FFFFFF"/>
<text x="20" y="30" class="panel-lbl">a</text>
<text x="42" y="30" class="title">Proposed Sub-Second Editorial Pre-Publication Verification Pipeline (Human-in-the-Loop)</text>
<text x="42" y="46" class="subtitle">Zero-heavy-dependency verification gate integrable into Editorial Manager / ScholarOne / Nature MTS workflows</text>
<rect x="30" y="72" width="175" height="118" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
<text x="117.5" y="96" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#0F172A;">1. Manuscript Intake</text>
<line x1="42" y1="105" x2="193" y2="105" stroke="#CBD5E1" stroke-width="1"/>
<text x="117.5" y="124" text-anchor="middle" style="font-size:9.5px;fill:#334155;">Submitted code repo,</text>
<text x="117.5" y="140" text-anchor="middle" style="font-size:9.5px;fill:#334155;">Source Data (.xlsx/.csv),</text>
<text x="117.5" y="156" text-anchor="middle" style="font-size:9.5px;fill:#334155;">and risk calculator</text>
<text x="117.5" y="172" text-anchor="middle" style="font-size:9.5px;fill:#334155;">artifacts</text>
<line x1="207" y1="131.0" x2="227" y2="131.0" stroke="#475569" stroke-width="2"/>
<polygon points="225,126.0 225,136.0 233,131.0" fill="#475569"/>
<rect x="235" y="72" width="185" height="118" rx="8" fill="#E0F2FE" stroke="#0072B2" stroke-width="1.8"/>
<text x="327.5" y="96" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#0F172A;">2. Reachability Gate</text>
<line x1="247" y1="105" x2="408" y2="105" stroke="#CBD5E1" stroke-width="1"/>
<text x="327.5" y="124" text-anchor="middle" style="font-size:9.5px;fill:#334155;">Verify live HTTP 200,</text>
<text x="327.5" y="140" text-anchor="middle" style="font-size:9.5px;fill:#334155;">non-empty code files,</text>
<text x="327.5" y="156" text-anchor="middle" style="font-size:9.5px;fill:#334155;">and Source Data schema</text>
<text x="327.5" y="172" text-anchor="middle" style="font-size:9.5px;fill:#334155;">(blocks 5.7% dead repos)</text>
<line x1="422" y1="131.0" x2="442" y2="131.0" stroke="#475569" stroke-width="2"/>
<polygon points="440,126.0 440,136.0 448,131.0" fill="#475569"/>
<rect x="450" y="72" width="230" height="118" rx="8" fill="#0072B2" stroke="#0072B2" stroke-width="1.8"/>
<text x="565.0" y="96" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#FFFFFF;">3. ClinAudit 4-Module Scan</text>
<line x1="462" y1="105" x2="668" y2="105" stroke="#38BDF8" stroke-width="1"/>
<text x="565.0" y="124" text-anchor="middle" style="font-size:9.5px;fill:#E0F2FE;">M1: Split &amp; mirror-clone check</text>
<text x="565.0" y="140" text-anchor="middle" style="font-size:9.5px;fill:#E0F2FE;">M2: Binary score / flat DCA / ckpt</text>
<text x="565.0" y="156" text-anchor="middle" style="font-size:9.5px;fill:#E0F2FE;">M3: Fixed/√B CI &amp; pseudorep P</text>
<text x="565.0" y="172" text-anchor="middle" style="font-size:9.5px;fill:#E0F2FE;">M4: Axiom &amp; monotonicity check</text>
<line x1="682" y1="131.0" x2="702" y2="131.0" stroke="#475569" stroke-width="2"/>
<polygon points="700,126.0 700,136.0 708,131.0" fill="#475569"/>
<rect x="710" y="72" width="180" height="118" rx="8" fill="#FEF3C7" stroke="#E69F00" stroke-width="1.8"/>
<text x="800.0" y="96" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#0F172A;">4. Disclosure Triage</text>
<line x1="722" y1="105" x2="878" y2="105" stroke="#CBD5E1" stroke-width="1"/>
<text x="800.0" y="124" text-anchor="middle" style="font-size:9.5px;fill:#334155;">Editorial / reviewer checks</text>
<text x="800.0" y="140" text-anchor="middle" style="font-size:9.5px;fill:#334155;">automated alerts against</text>
<text x="800.0" y="156" text-anchor="middle" style="font-size:9.5px;fill:#334155;">Methods &amp; Limitations</text>
<text x="800.0" y="172" text-anchor="middle" style="font-size:9.5px;fill:#334155;">(prevents over-rejection)</text>
<line x1="892" y1="131.0" x2="912" y2="131.0" stroke="#475569" stroke-width="2"/>
<polygon points="910,126.0 910,136.0 918,131.0" fill="#475569"/>
<rect x="920" y="72" width="175" height="118" rx="8" fill="#DCFCE7" stroke="#009E73" stroke-width="1.8"/>
<text x="1007.5" y="96" text-anchor="middle" style="font-size:11.5px;font-weight:700;fill:#0F172A;">5. Resolution Gate</text>
<line x1="932" y1="105" x2="1083" y2="105" stroke="#CBD5E1" stroke-width="1"/>
<text x="1007.5" y="124" text-anchor="middle" style="font-size:9.5px;fill:#334155;">Clean → Peer review</text>
<text x="1007.5" y="140" text-anchor="middle" style="font-size:9.5px;fill:#334155;">Undisclosed defect →</text>
<text x="1007.5" y="156" text-anchor="middle" style="font-size:9.5px;fill:#334155;">Author fix before review</text>
<text x="1007.5" y="172" text-anchor="middle" style="font-size:9.5px;fill:#334155;">or safety patch</text>
<text x="20" y="228" class="panel-lbl">b</text>
<text x="42" y="228" class="title">Summary of Verified Undisclosed Defects (6 in 2026 + 1 Out-of-Time Late-2025) &amp; Interception Mapping</text>
<rect x="30" y="242" width="1065" height="24" rx="4" fill="#1E293B"/>
<text x="38" y="258" style="font-size:10px;font-weight:700;fill:#FFFFFF;">Study (Journal &amp; Cohort)</text>
<text x="303" y="258" style="font-size:10px;font-weight:700;fill:#FFFFFF;">Discovery Mode</text>
<text x="433" y="258" style="font-size:10px;font-weight:700;fill:#FFFFFF;">Stage / Defect Mechanism</text>
<text x="743" y="258" style="font-size:10px;font-weight:700;fill:#FFFFFF;">Headline Impact</text>
<text x="988" y="258" style="font-size:10px;font-weight:700;fill:#FFFFFF;">ClinAudit Rule</text>
<rect x="30" y="266" width="1065" height="21" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.6"/>
<text x="38" y="280.5" style="font-size:9.1px;font-weight:700;fill:#1E293B;">Chen et al. (npj Digit. Med. 2026)</text>
<text x="303" y="280.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">Ref. / Blind v0.1</text>
<text x="433" y="280.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">S1: 63%–69% exact train–test clones (.isin() split)</text>
<text x="743" y="280.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">Unseen AUC 0.96 → 0.49–0.72</text>
<text x="988" y="280.5" style="font-size:9.1px;font-weight:700;fill:#0072B2;">LEAK-001/003</text>
<rect x="30" y="287" width="1065" height="21" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.6"/>
<text x="38" y="301.5" style="font-size:9.1px;font-weight:700;fill:#1E293B;">Lin et al. (npj Digit. Med. 2026)</text>
<text x="303" y="301.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">Ref. / Calib. v0.2</text>
<text x="433" y="301.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">S2: Binarized CHA2DS2-VASc + hardcoded pt=0.2 DCA</text>
<text x="743" y="301.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">Net benefit understated 3.4×–5.0×</text>
<text x="988" y="301.5" style="font-size:9.1px;font-weight:700;fill:#0072B2;">EVAL-002</text>
<rect x="30" y="308" width="1065" height="21" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.6"/>
<text x="38" y="322.5" style="font-size:9.1px;font-weight:700;fill:#1E293B;">Axelsson et al. (PLOS Med. 2026)</text>
<text x="303" y="322.5" style="font-size:9.1px;font-weight:400;fill:#D55E00;">Prospective Blind*</text>
<text x="433" y="322.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">S2: Binary {0,1} calib. + uncensored/survivor-drop C-idx</text>
<text x="743" y="322.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">Distorted XGBoost calib. &amp; C-index</text>
<text x="988" y="322.5" style="font-size:9.1px;font-weight:700;fill:#0072B2;">EVAL-003</text>
<rect x="30" y="329" width="1065" height="21" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.6"/>
<text x="38" y="343.5" style="font-size:9.1px;font-weight:700;fill:#1E293B;">Jin et al. (Nat. Comm. 2026)</text>
<text x="303" y="343.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">Ref. / Calib. v0.2</text>
<text x="433" y="343.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">S3: 111/111 ±0.003 CIs; bootstrap Wilcoxon P=10⁻¹⁶¹</text>
<text x="743" y="343.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">80.9% primary tasks P&gt;0.05 (ρ=0.5)</text>
<text x="988" y="343.5" style="font-size:9.1px;font-weight:700;fill:#0072B2;">STAT-001–005</text>
<rect x="30" y="350" width="1065" height="21" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.6"/>
<text x="38" y="364.5" style="font-size:9.1px;font-weight:700;fill:#1E293B;">Turki et al. (Nat. Comm. 2026)</text>
<text x="303" y="364.5" style="font-size:9.1px;font-weight:400;fill:#D55E00;">Prospective Blind*</text>
<text x="433" y="364.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">S3: std_dev / sqrt(2000) bootstrap-SE CI bug</text>
<text x="743" y="364.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">44.7× CI shrinkage (166+ zero-width)</text>
<text x="988" y="364.5" style="font-size:9.1px;font-weight:700;fill:#0072B2;">STAT-002</text>
<rect x="30" y="371" width="1065" height="21" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.6"/>
<text x="38" y="385.5" style="font-size:9.1px;font-weight:700;fill:#1E293B;">Zhu et al. (PLOS Med. 2026)</text>
<text x="303" y="385.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">Ref. / Calib. v0.2</text>
<text x="433" y="385.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">S4: abs(coef_vec) + cross-model Sex encoding clash</text>
<text x="743" y="385.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">26.1% women CVD &gt; All-cause mort.</text>
<text x="988" y="385.5" style="font-size:9.1px;font-weight:700;fill:#0072B2;">DEPLOY-004</text>
<rect x="30" y="392" width="1065" height="21" fill="#FFF7ED" stroke="#E2E8F0" stroke-width="0.6"/>
<text x="38" y="406.5" style="font-size:9.1px;font-weight:700;fill:#1E293B;">Xiao et al. (Nat. Comm. Dec 2025)</text>
<text x="303" y="406.5" style="font-size:9.1px;font-weight:400;fill:#D55E00;">OOT Late-2025†</text>
<text x="433" y="406.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">S2/3: EVAL-004 triage → fixed random_state=1996 loop</text>
<text x="743" y="406.5" style="font-size:9.1px;font-weight:400;fill:#1E293B;">25 published SDs = ε (10⁻¹⁶–10⁻²⁹⁶)</text>
<text x="988" y="406.5" style="font-size:9.1px;font-weight:700;fill:#0072B2;">EVAL-004†</text>
<text x="30" y="427" style="font-size:8.7px;fill:#475569;">*Zero-knowledge blind 2026 discoveries (0 prior corrections). †Out-of-time late-2025 frozen v0.2.0 EVAL-004 triage exposing 25 machine-epsilon SDs (11 loops). Two 2026 human-triage controls excluded: Fletcher-Lloyd (disclosed scaling) &amp; Wang (validation-set naming ambiguity).</text>
